name: CI/CD - test, then deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:          # also lets you run it manually from the Actions tab

jobs:
  test:                       # CI: check the model before deploying
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  deploy:                     # CD: only runs if the tests passed
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: KasiditL/credit-risk-predictor
          hf_token: ${{ secrets.HF_TOKEN }}
